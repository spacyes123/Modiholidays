name: Validate public website

on:
  push:
    branches:
      - main
      - release/website-integration-20261125
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/prepare-seo.cjs
      - run: python scripts/validate.py
      - name: Build strict Cloudflare Pages artifact
        run: node scripts/build-cloudflare-pages.cjs dist
      - name: Run public website and artifact regression tests
        run: >-
          node --test
          scripts/whatsapp.test.cjs
          scripts/seo-quality.test.cjs
          scripts/homepage-prototype.test.cjs
          scripts/prototype-interactions.test.cjs
          scripts/public-artifact.test.cjs
          scripts/workflow-safety.test.cjs
