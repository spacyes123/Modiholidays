name: Validate and prepare public Pages artifact

on:
  push:
    branches:
      - main
      - release/deployment-safety
  pull_request:
  workflow_dispatch:
    inputs:
      publish_production:
        description: 'Explicitly authorize the main-branch GitHub Pages deployment'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_site.py
      - run: python scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/whatsapp.test.cjs
      - name: Build strict public artifact
        run: node scripts/build-public-artifact.cjs dist
      - name: Test public artifact exclusions and contents
        run: node --test scripts/public-artifact.test.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_production == true && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy manually authorized artifact
        id: deployment
        uses: actions/deploy-pages@v4
