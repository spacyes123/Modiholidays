name: Validate public website

on:
  push:
    branches:
      - main
      - release/deployment-safety
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_site.py
      - run: python scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/whatsapp.test.cjs
      - name: Build strict public artifact
        run: node scripts/build-public-artifact.cjs dist
      - name: Test public artifact exclusions and contents
        run: node --test scripts/public-artifact.test.cjs scripts/workflow-safety.test.cjs
